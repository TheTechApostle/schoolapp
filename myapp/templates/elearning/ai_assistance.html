{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap + FontAwesome -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Markdown Support -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body{
    background:#f1f5f9;
    font-family:system-ui;
}

/* Header */
.page-header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:2rem;
    border-radius:18px;
    margin-bottom:1.5rem;
}

/* Chat Card */
.ai-card{
    background:white;
    border-radius:18px;
    padding:1.5rem;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

/* Chat Box */
.chat-box{
    height:400px;
    overflow-y:auto;
    border:1px solid #e5e7eb;
    padding:15px;
    border-radius:15px;
    background:#f8fafc;
    margin-bottom:15px;
}

/* User Bubble */
.user-msg{
    background:linear-gradient(135deg,#d1fae5,#a7f3d0);
    padding:12px 16px;
    border-radius:18px;
    margin-bottom:10px;
    max-width:75%;
    margin-left:auto;
    text-align:right;
    font-weight:600;
}

/* AI Bubble */
.ai-msg{
    background:#e5e7eb;
    padding:12px 16px;
    border-radius:18px;
    margin-bottom:10px;
    max-width:75%;
    line-height:1.6;
}
/* ChatGPT Input Container */
.chat-input-area{
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:12px;
    background:white;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

/* Row Layout */
.chat-input-row{
    display:flex;
    align-items:center;
    gap:10px;
}

/* Upload Button */
.upload-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#f3f4f6;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:0.2s;
}

.upload-btn:hover{
    background:#e5e7eb;
}

.upload-btn i{
    font-size:16px;
    color:#374151;
}

/* Textarea like ChatGPT */
.chat-input-row textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-size:15px;
    padding:10px;
    border-radius:12px;
    background:transparent;
    max-height:120px;
}

/* Send Circle Button */
.send-circle{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:#2563eb;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:0.2s;
}

.send-circle:hover{
    background:#1e40af;
}

.send-circle i{
    font-size:16px;
}

/* File Preview Chip */
.file-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f3f4f6;
    padding:6px 12px;
    border-radius:12px;
    font-size:14px;
    margin-bottom:8px;
    width:fit-content;
}

.file-chip i{
    color:#2563eb;
}

/* Remove File Button */
.remove-file{
    border:none;
    background:none;
    font-size:18px;
    cursor:pointer;
    color:#6b7280;
}

.remove-file:hover{
    color:red;
}
/* Markdown Styling */
.ai-msg ul{ padding-left:20px; }
.ai-msg li{ margin-bottom:6px; }
.ai-msg pre{
    background:#111827;
    color:white;
    padding:12px;
    border-radius:12px;
    overflow-x:auto;
}

/* Typing */
.ai-loading{
    font-style:italic;
    color:#64748b;
}

/* Send Button */
.send-btn{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    border:none;
    border-radius:12px;
    color:white;
    padding:10px 18px;
    font-weight:600;
}
</style>
</head>

<body>

{% include "header.html" %}

<div class="container-fluid py-4">
    <div class="row">
        <div class="col-md-4">
            {%  include 'elearning/sidebar.html' %}
        </div>
    <div class="col-md-8">
    <!-- Header -->
            <div class="page-header">
                <h4 class="fw-bold text-white">
                    <i class="fa fa-robot"></i> AI Learning Assistant
                </h4>
                <p class="mb-0"><marquee>Ask questions, upload documents, and learn faster.</marquee></p>
            </div>

            <!-- Chat Card -->
            <div class="ai-card">

                <!-- Chat Box -->
                <div class="chat-box" id="chat"></div>

                <!-- Prompt -->
                <!-- ChatGPT Style Input Area -->
                <div class="chat-input-area">

                    <!-- File Preview Chip -->
                    <div id="filePreviewBox" class="file-chip" style="display:none;">
                        <i class="fa fa-file-alt"></i>
                        <span id="fileName"></span>
                        <button onclick="removeFile()" class="remove-file">&times;</button>
                    </div>

                    <!-- Input Row -->
                    <div class="chat-input-row">

                        <!-- Upload Button -->
                        <label class="upload-btn">
                            <i class="fa fa-paperclip"></i>
                            <input type="file" id="fileInput" hidden>
                        </label>

                        <!-- Textarea -->
                        <textarea id="prompt"
                            placeholder="Message AI Assistant..."
                            rows="1"></textarea>

                        <!-- Send Button -->
                        <button class="send-circle" onclick="sendPrompt()">
                            <i class="fa fa-arrow-up"></i>
                        </button>

                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

{% include "footer.html" %}

<script>
/* File Preview */
document.getElementById("fileInput").addEventListener("change", function(e){

    let file = e.target.files[0];
    if(!file) return;

    document.getElementById("filePreviewBox").style.display = "block";
    document.getElementById("fileName").innerHTML =
        `<i class="fa fa-paperclip"></i> ${file.name}`;
});


/* Add User Message */
function addUserMessage(msg){
    let chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="user-msg">${msg}</div>
    `;

    chat.scrollTop = chat.scrollHeight;
}

/* Add File Bubble */
function addUserFile(file){
    let chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="user-msg">
            <i class="fa fa-file"></i>
            <b>${file.name}</b><br>
            <small>${(file.size/1024).toFixed(1)} KB</small>
        </div>
    `;
}

/* Add AI Message */
function addAIMessage(msg){
    let chat = document.getElementById("chat");

    let formatted = marked.parse(msg);

    chat.innerHTML += `
        <div class="ai-msg">${formatted}</div>
    `;

    chat.scrollTop = chat.scrollHeight;
}


/* Send Prompt */
function sendPrompt(){

    let prompt = document.getElementById("prompt").value.trim();
    let file = document.getElementById("fileInput").files[0];

    if(!prompt && !file) return;

    if(prompt) addUserMessage(prompt);
    if(file) addUserFile(file);

    sendToAI(prompt, file);

    document.getElementById("prompt").value="";
    document.getElementById("fileInput").value="";
    document.getElementById("filePreviewBox").style.display="none";
}


/* Send to Backend */
function sendToAI(prompt, file){

    let chat = document.getElementById("chat");

    let loadingEl = document.createElement("div");
    loadingEl.className = "ai-msg ai-loading";
    loadingEl.innerHTML = "AI is typing...";
    chat.appendChild(loadingEl);

    let formData = new FormData();
    formData.append("prompt", prompt);

    if(file){
        formData.append("file", file);
    }

    fetch("{% url 'ai_assistance' %}", {
        method:"POST",
        headers:{
            "X-CSRFToken":"{{ csrf_token }}"
        },
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        loadingEl.remove();
        addAIMessage(data.response);
    })
    .catch(err => {
        loadingEl.remove();
        addAIMessage("⚠️ Error connecting to AI.");
    });
}
</script>

</body>
</html>
