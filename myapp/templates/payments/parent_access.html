{% load static %}
{% include '../header.html' %}
<style>
    body {
        background: #fff;
        min-height: 100vh;
       
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Poppins", sans-serif;
    }

    .card-custom {
        background: #ffffff;
        border-radius: 16px;
        padding: 35px 30px;
        width: 90%;
        max-width: 560px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        animation: fadeIn .4s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .form-control-lg {
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid #ced4da;
        transition: all 0.2s ease-in-out;
    }

    .form-control-lg:focus {
        border-color: #2575fc;
        box-shadow: 0 0 0 4px rgba(37, 117, 252, 0.15);
    }

    .form-label {
        font-weight: 600;
        color: #333;
    }

    .btn-primary {
        background: #2575fc;
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.25s ease;
    }

    .btn-primary:hover {
        background: #1d5ed8;
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(37, 117, 252, 0.3);
    }

    .small-text {
        font-size: 0.85rem;
        color: #6c757d;
    }
</style>

<body>

    <section class="container">
        <div class="row">
            <div class="col-lg-6 col-sm-12">
                <div class="card card-custom my-5">
                    <h3 class="text-center mb-3" style="font-weight: 700;">Parent Access Portal</h3>

                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{% url 'parent_access'%}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Child's Admission Number</label>
                            <input type="text" name="admission_number" class="form-control form-control-lg"
                                placeholder="e.g., ADM12345" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Access Code</label>
                            <input type="password" name="access_code" class="form-control form-control-lg"
                                placeholder="Enter Access Code" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Access Dashboard</button>
                    </form>

                    <p class="text-center mt-3 small-text">
                        Contact the school administration if you don't have an access code.
                    </p>
                </div>
            </div>
            <div class="col-lg-6 d-none d-lg-block"
                style="background-image: url('{% static 'img/parent-child.png' %}'); 
                background-size: cover; 
                background-position: center; 
                min-height: 100vh;">
                
            </div>
        </div>
    </section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% include '../footer.html' %}
</body>
</html>
